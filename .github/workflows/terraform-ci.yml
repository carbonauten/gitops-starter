name: Terraform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitops-starter-terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        # Provider checksum downloads (esp. alicloud/hcloud from GitHub Releases)
        # occasionally time out; retry a few times before failing the job.
        run: |
          for attempt in 1 2 3; do
            if terraform init -backend=false; then
              exit 0
            fi
            echo "terraform init failed (attempt ${attempt}/3); retrying in 15s…"
            sleep 15
          done
          exit 1

      - name: Terraform validate
        run: terraform validate
